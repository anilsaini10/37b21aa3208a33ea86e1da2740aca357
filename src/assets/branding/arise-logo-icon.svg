<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Arise icon</title>
<desc>Circular badge icon for Arise showing a parent node and a teacher node both connected to a central rising student node with satellite data points, on a rich blue to indigo gradient.</desc>
<defs>
<linearGradient id="badgeGrad" x1="10%" y1="0%" x2="90%" y2="100%">
<stop offset="0%" stop-color="#2F6FB0" />
<stop offset="55%" stop-color="#2E4E8F" />
<stop offset="100%" stop-color="#3A2E78" />
</linearGradient>
<radialGradient id="sheen" cx="30%" cy="22%" r="75%">
<stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.28" />
<stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.06" />
<stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
</radialGradient>
<filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
<feDropShadow dx="0" dy="26" stdDeviation="34" flood-color="#14142B" flood-opacity="0.35" />
</filter>
</defs>

<circle cx="540" cy="540" r="440" fill="url(#badgeGrad)" filter="url(#softShadow)" />
<circle cx="540" cy="540" r="440" fill="url(#sheen)" />
<circle cx="540" cy="540" r="440" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="3" />

<path d="M213,741 Q540,930 867,741" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" opacity="0.5" />

<line x1="213" y1="741" x2="540" y2="383" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" />
<line x1="867" y1="741" x2="540" y2="383" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" />

<line x1="540" y1="383" x2="446" y2="320" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round" opacity="0.8" />
<line x1="540" y1="383" x2="634" y2="320" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round" opacity="0.8" />

<circle cx="446" cy="320" r="25" fill="#FFFFFF" opacity="0.9" />
<circle cx="634" cy="320" r="25" fill="#FFFFFF" opacity="0.9" />

<circle cx="540" cy="383" r="94" fill="none" stroke="#FFFFFF" stroke-width="13" opacity="0.5" />
<circle cx="540" cy="383" r="57" fill="#FFFFFF" />

<circle cx="213" cy="741" r="50" fill="#FFFFFF" />
<circle cx="867" cy="741" r="50" fill="#FFFFFF" />
</svg>
